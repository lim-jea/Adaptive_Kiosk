server {
    listen 80;
    server_name _;

    # ─── 보안 헤더 ──────────────────────────────────────────────────────────
    # Cloudflare Tunnel 이 앞단에서 HTTPS 종단 처리 — nginx 는 80 유지하되 HSTS 헤더는 클라이언트로 전달된다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    # CSP — 인라인 스타일/이미지는 허용. 외부 리소스 차단.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' data: blob:; font-src 'self' data:;" always;

    # API 요청 → 백엔드 (FastAPI)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 백엔드 유틸리티 경로
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 프런트엔드 (React SPA)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
