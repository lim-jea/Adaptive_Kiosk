services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_KIOSK_API_KEY: ${VITE_KIOSK_API_KEY}
        VITE_ENCRYPTION_ENABLED: "false"
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on:
      - proxy
    restart: unless-stopped
